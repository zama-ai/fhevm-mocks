# Dependabot reads this file from main only. It ignores the copies on other branches.
#
# Where Dependabot runs
#
# main holds the legacy mock-utils packages, still published as npm `latest` (0.4.x). The maintained
# tooling lives on release/0.13.x, release/0.14.x and release/0.15.x. GitHub raises Dependabot alerts and
# opens security updates on main only, so the release branches can get version updates and nothing else.
#
#   - main, npm: security updates only. `open-pull-requests-limit: 0` turns off version updates. Security
#     updates have their own limit and keep running. The `security-minor-patch` group puts every minor and
#     patch fix in one PR. Without it, #214 mixed majors (vite 7 to 8) with patch fixes, the majors failed
#     `npm ci`, and no fix could merge. GitHub documents this split for version updates only. On the first
#     security PR after this change, check that a fix needing a major arrives in a PR of its own.
#   - release branches, github-actions: one grouped PR per branch on the 1st of each month, with at most
#     one open. Actions are pinned by SHA. Dependabot moves the SHA and its `# vX.Y.Z` comment, and these
#     PRs pass CI. Weekly PRs on three branches waited weeks to merge, so the schedule is monthly.
#   - `cooldown` on every block. Dependabot waits 7 days after a release before it proposes that release,
#     so a compromised version has time to be pulled upstream. Cooldown has no effect on security updates.
#     The main block keeps it because the zizmor `dependabot-cooldown` audit (zizmor 1.15 and later) flags
#     a block without it.
#
# What Dependabot leaves out, and how it gets updated instead
#
#   - npm on the release branches. Dependabot edits package.json files in hardhat/v2 and hardhat/v3 even
#     with `versioning-strategy: lockfile-only`. In these nested workspaces it runs
#     `npm install <pkg>@<version> --workspace=<member> --package-lock-only`, and npm rewrites the ranges.
#     In #248 it also added prettier and typescript-eslint to the `dependencies` of the published
#     hardhat/v2/plugin/pkg, and raised its hardhat peer range from ^2.0.0 to ^2.29.2. A PR without these
#     errors still fails. NR-31 needs a range to be the same in every package.json, and Dependabot moves
#     it one directory at a time. Once a month, update release/0.13.x, then 0.14.x, then 0.15.x by hand:
#       - `make update-dependencies` moves the ranges in every package.json together.
#       - `make sync-pinned` moves the pinned versions of npm-manifest.json.
#       - `npm outdated` lists the majors. Move them by hand.
#   - cargo (operators-data/tfhe-vectors-check). CI does not build the crate, so a Dependabot PR tests
#     nothing and still runs the full test suite. The tfhe crates stay on the version of the test vectors.
#     Run `cargo update` by hand when you change the vectors.
#   - GitHub Actions on main. GitHub raises no alerts for SHA-pinned actions, so a security-only block
#     can never open a PR. Bump them by hand before the next 0.4.x release.
#   - The Foundry version, setup-node's `node-version`, `npm install -g npm@x`, and the zizmor and
#     safe-chain versions. Dependabot does not track them. Bump them by hand.
#
# When a release line starts, add a github-actions block for it. When a line ends, remove its block.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      security-minor-patch:
        applies-to: security-updates
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    target-branch: "release/0.13.x"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    target-branch: "release/0.14.x"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    target-branch: "release/0.15.x"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]
