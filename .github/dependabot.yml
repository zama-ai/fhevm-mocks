# Dependabot only reads this file from the default branch (main): a copy on a release branch is
# ignored. The maintained tooling lives on release/0.13.x, 0.14.x and 0.15.x, so each of those gets
# its own blocks with a `target-branch`; main only holds the legacy mock-utils packages.
#
# Two kinds of PRs:
#   - security updates, opened when a Dependabot alert fires. They only ever target main, and only if
#     "Dependabot security updates" is enabled in the repo settings (this file does not enable it).
#     `open-pull-requests-limit: 0` (the main blocks) turns off version updates but keeps these.
#   - version updates, opened weekly on each release branch: minor/patch grouped into one PR per
#     directory, package-lock.json only (see below). Majors are never proposed.
#
# npm `versioning-strategy: lockfile-only` (release-branch blocks): Dependabot only re-resolves
# package-lock.json within the ranges already declared, and never edits a package.json. Letting it
# edit them broke the release branches in three ways (#196-#198):
#   - in the nested workspaces (plugin + plugin/pkg, fhevm-hardhat-template + pkg) it copied the
#     parent's dev tools (eslint, prettier, publint, @types/node, typescript-eslint) into the
#     `dependencies` of the published pkg/package.json files;
#   - a group picks one target version per package and writes it into every directory, so
#     hardhat/v2/fhevm-hardhat-template/pkg went eslint ^9 -> ^10 although majors are ignored;
#   - it raised root ranges (and the plugins' viem peer range) without the test-consumers, which
#     `fhevm-npm-cli check dependencies` (rule 4.2.1) rejects.
# Ranges in package.json files therefore move by hand, across every package at once.
#
# `cooldown` makes Dependabot wait 7 days after a version is published before proposing it, so a
# compromised release has time to be caught upstream. It only delays Dependabot's PRs: it never
# blocks publishing our own packages, and a dependency can still be bumped by hand at any time.
#
# npm `directories`: "/" covers the root package.json and its workspaces (common, host-contracts-
# cleartext/*, foundry/*). hardhat/v2, hardhat/v3 and fhevm-npm are separate npm projects with their
# own package-lock.json, so they are listed explicitly; a "/**" glob would also pick up the
# test-consumers below.
#
# Not covered on purpose:
#   - the test-consumer/*/package-lock.json files: they install the locally packed tarballs and are
#     regenerated by `fhevm-npm-cli test-consumer-regenerate-package-lock`, which npm alone cannot
#     reproduce.
#   - `npm install -g npm@x` and setup-node's `node-version` in the workflows: Dependabot does not
#     track either; bump them by hand.
#
# Ignored: the pins of npm-manifest.json (@fhevm/sdk, @fhevm/solidity, encrypted-types,
# @openzeppelin/contracts, @openzeppelin/contracts-upgradeable). They move together across every
# package.json with `make sync-pinned`, and `fhevm-npm-cli check pinned-dependencies` rejects a
# lone bump, so a Dependabot PR for one of them could never be merged as is.
#
# Also ignored on the release-branch npm blocks: every semver-major update. A major on a release line
# is a deliberate change made by hand, never a Dependabot PR. In particular:
#   - hardhat/v2 MUST stay on Hardhat 2 and hardhat/v3 on Hardhat 3, plugins included
#     (@nomicfoundation/*). An `ignore` applies to the whole block, so a hardhat-only rule cannot
#     tell the two directories apart; the semver-major rule keeps each on its own line.
#   - @types/node must keep the engines.node minimum major (22, from ">=22.23.4"), as
#     `fhevm-npm-cli check package-json` enforces: newer types would accept Node APIs that crash on
#     Node 22. Move it together with engines.node and CI's node-version.
#   - Dependabot no longer reports majors, so check them on purpose (e.g. `npm outdated`) when a new
#     release line starts. With lockfile-only, the same goes for anything outside a declared range
#     (e.g. 0.2 -> 0.3 under "^0.2.12").
#
# Majors are NOT ignored on the github-actions and cargo blocks: action majors are usually safe.
#
# cargo: tfhe-rs (`tfhe`) and its own crates (`tfhe-*`: tfhe-fft, tfhe-ntt, tfhe-versionable, ...)
# are never touched, any version. Each checker validates the operator vectors against one exact
# tfhe-rs line (~1.7, and ~1.6 in tfhe16/), so its version only moves by hand, together with the
# vectors. Only the other crates (serde, serde_json, ...) get Dependabot updates.
version: 2
updates:
  # ---------------------------------------------------------------------------------------------
  # main (legacy mock-utils): security updates only
  # ---------------------------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/"
    # Check for updates every Monday
    schedule:
      interval: "weekly"
    # Set to 0 to prevent version updates (i.e. require only security updates)
    open-pull-requests-limit: 0

  - package-ecosystem: "github-actions"
    directory: "/"
    # Check for updates every Monday
    schedule:
      interval: "weekly"
    # Set to 0 to prevent version updates (i.e. require only security updates)
    open-pull-requests-limit: 0

  # ---------------------------------------------------------------------------------------------
  # npm: the root workspace, hardhat/v2, hardhat/v3 and fhevm-npm, one block per release branch
  # ---------------------------------------------------------------------------------------------
  - package-ecosystem: "npm"
    target-branch: "release/0.13.x"
    directories: ["/", "/hardhat/v2", "/hardhat/v3", "/fhevm-npm"]
    # Check for updates every Monday
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Only package-lock.json changes, never a package.json (see the header).
    versioning-strategy: lockfile-only
    # Wait 7 days after a version is published before proposing it, so a compromised release has
    # time to be caught and pulled upstream (the same idea as safe-chain's minimum package age).
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    # One PR per directory instead of one per package.
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    # The npm-manifest.json pins, bumped with `make sync-pinned` (see the header).
    ignore:
      - dependency-name: "@fhevm/sdk"
      - dependency-name: "@fhevm/solidity"
      - dependency-name: "encrypted-types"
      - dependency-name: "@openzeppelin/contracts"
      - dependency-name: "@openzeppelin/contracts-upgradeable"
      # No majors on a release line: keeps hardhat/v2 on Hardhat 2, hardhat/v3 on Hardhat 3, and
      # @types/node on the engines.node major.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    target-branch: "release/0.14.x"
    directories: ["/", "/hardhat/v2", "/hardhat/v3", "/fhevm-npm"]
    # Check for updates every Monday
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    versioning-strategy: lockfile-only
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    # The npm-manifest.json pins, bumped with `make sync-pinned` (see the header).
    ignore:
      - dependency-name: "@fhevm/sdk"
      - dependency-name: "@fhevm/solidity"
      - dependency-name: "encrypted-types"
      - dependency-name: "@openzeppelin/contracts"
      - dependency-name: "@openzeppelin/contracts-upgradeable"
      # No majors on a release line: keeps hardhat/v2 on Hardhat 2, hardhat/v3 on Hardhat 3, and
      # @types/node on the engines.node major.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    target-branch: "release/0.15.x"
    directories: ["/", "/hardhat/v2", "/hardhat/v3", "/fhevm-npm"]
    # Check for updates every Monday
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    versioning-strategy: lockfile-only
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    # The npm-manifest.json pins, bumped with `make sync-pinned` (see the header).
    ignore:
      - dependency-name: "@fhevm/sdk"
      - dependency-name: "@fhevm/solidity"
      - dependency-name: "encrypted-types"
      - dependency-name: "@openzeppelin/contracts"
      - dependency-name: "@openzeppelin/contracts-upgradeable"
      # No majors on a release line: keeps hardhat/v2 on Hardhat 2, hardhat/v3 on Hardhat 3, and
      # @types/node on the engines.node major.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ---------------------------------------------------------------------------------------------
  # github-actions: actions are pinned by SHA; Dependabot moves the SHA and its `# vX.Y.Z` comment
  # ---------------------------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    target-branch: "release/0.13.x"
    directory: "/"
    # Check for updates every Monday
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    target-branch: "release/0.14.x"
    directory: "/"
    # Check for updates every Monday
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    target-branch: "release/0.15.x"
    # Check for updates every Monday
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]

  # ---------------------------------------------------------------------------------------------
  # cargo: operators-data/tfhe-vectors-check, a local checker for the operator test vectors
  # ---------------------------------------------------------------------------------------------
  # minor/patch in one PR.
  - package-ecosystem: "cargo"
    target-branch: "release/0.13.x"
    directories: ["/operators-data/tfhe-vectors-check", "/operators-data/tfhe-vectors-check/tfhe16"]
    # Check for updates every Monday
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
    # tfhe-rs is never touched, nor its own crates (tfhe-fft, tfhe-ntt, ...): see the header.
    ignore:
      - dependency-name: "tfhe"
      - dependency-name: "tfhe-*"

  - package-ecosystem: "cargo"
    target-branch: "release/0.14.x"
    directories: ["/operators-data/tfhe-vectors-check", "/operators-data/tfhe-vectors-check/tfhe16"]
    # Check for updates every Monday
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
    # tfhe-rs is never touched, nor its own crates (tfhe-fft, tfhe-ntt, ...): see the header.
    ignore:
      - dependency-name: "tfhe"
      - dependency-name: "tfhe-*"

  - package-ecosystem: "cargo"
    target-branch: "release/0.15.x"
    directories: ["/operators-data/tfhe-vectors-check", "/operators-data/tfhe-vectors-check/tfhe16"]
    # Check for updates every Monday
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
    # tfhe-rs is never touched, nor its own crates (tfhe-fft, tfhe-ntt, ...): see the header.
    ignore:
      - dependency-name: "tfhe"
      - dependency-name: "tfhe-*"
