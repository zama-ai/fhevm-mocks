name: sdk-cleartext-docs

# The rule books and the Markdown links.
#
# sdk-cleartext-tests.yml skips a pull request that only changes prose: rules/** and the Markdown its
# `changes` filter lists. Such a pull request can still break a rule entry, an index under rules/, or a
# link in a .md file. This workflow checks those on every pull request:
#
# - `make check-rules` with RULES_BASE: every registry folder under rules/ is well formed, its index and
#   group pages match its entries, and no ID indexed on the base branch was deleted or un-retired.
# - `check md-links --offline`: every relative link in a .md file git does not ignore resolves. Web links
#   are not checked here, so an outside site being down never blocks a merge.
#
# Meant to be a REQUIRED check (`sdk-cleartext-docs/check`). That is why it runs on EVERY pull request,
# with no `paths:` filter: a workflow skipped by a path filter reports no check at all, and a required
# check that never reports leaves the pull request waiting forever (see sdk-cleartext-deployments.yml).
#
# It never runs `make check-rules-links`: that target runs whatever a rule's checked-by names, and a
# pull request can change a checked-by.
on:
  pull_request:
    branches:
      - release/0.14.x

# No permissions at the workflow level — each job declares only what it needs.
permissions: {}

# A newer push to the same pull request makes the running check pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: sdk-cleartext-docs/check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: 'read' # Required to checkout repository code
    steps:
      # Full history: `--base` reads the rule indexes on the pull request's base commit.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'
          fetch-depth: 0

      # 22.x: ./fhevm-npm-cli runs a .ts entry point and relies on Node's type stripping, on by default
      # from 22.18.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '>=22.23.4 <23'

      # Aikido's supply-chain monitor, as in sdk-cleartext-tests.yml: blocks a package with a known-malicious
      # checksum before npm can run it.
      - name: Install safe-chain
        shell: bash
        run: curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.3/install-safe-chain.sh | sh -s -- --ci

      - name: Update npm
        run: npm install -g npm@11.7.0

      # fhevm-npm is an autonomous root: it runs with nothing else installed.
      - name: Install fhevm-npm
        run: npm --prefix fhevm-npm ci --no-audit --no-fund

      # mlc (Markup Link Checker, https://github.com/becheran/mlc) checks the .md links for
      # `check md-links`. The runner has cargo; pinned and built from source as tfhe-rs installs it.
      # Keep the version equal to the one in sdk-cleartext-tests.yml.
      - name: Install mlc
        run: cargo install --locked --version 1.3.0 mlc

      - name: Check the rule books
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: make check-rules RULES_BASE="$BASE_SHA"

      - name: Check the Markdown links
        run: ./fhevm-npm-cli check md-links --offline
