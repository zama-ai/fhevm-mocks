name: sdk-cleartext-tests-latest-nightly

# The tests that a live chain can break: every test of ALL_TESTS.json that reaches a live chain at its
# latest block (`test-engine run --latest`). A chain moves on its own schedule, so these tests can fail
# with no change in this repository. They never run on a pull request (sdk-cleartext-tests.yml
# runs `--ci --no-latest`); they run here, once a night, and a red run means a chain moved past what the
# code knows: a decision to make, not a broken pull request.
#
# GitHub fires `schedule:` only from the default branch, so the night run is started by
# sdk-cleartext-nightly.yml on `main`, at 02:17 UTC, which calls this file at its release branch
# (`workflow_call`, with `ref`). It can also be started by hand (`workflow_dispatch`).
on:
  workflow_call:
    inputs:
      ref:
        description: The branch to check out and test, such as release/0.14.x.
        type: string
        required: true
    secrets:
      FHEVM_QUICKNODE_ENDPOINT_NAME:
        required: false
      FHEVM_QUICKNODE_TOKEN_ID:
        required: false
  workflow_dispatch:

# No permissions at the workflow level — each job declares only what it needs.
permissions: {}

# A night run is never worth two at once: a manual run waits for the scheduled one.
# A fixed name, not github.workflow: in a called workflow that is the caller's name, shared with the
# other night run.
concurrency:
  group: sdk-cleartext-tests-latest-nightly-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  latest:
    name: sdk-cleartext-tests-latest-nightly/test
    # The runner of sdk-cleartext-tests.yml: runs-on.io, 4 vCPU, with the S3-backed cache.
    runs-on: runs-on=${{ github.run_id }}/runner=4cpu-linux-x64/extras=s3-cache
    timeout-minutes: 90
    permissions:
      contents: 'read' # Required to checkout repository code
    steps:
      # -----------------------------------------------------------------------
      # 0. RunsOn
      #    Required by `extras=s3-cache`, and it must be the first step: see
      #    sdk-cleartext-tests.yml.
      # -----------------------------------------------------------------------
      - name: Set up RunsOn
        uses: runs-on/action@4a3bfc79f21a9b97e972e2ba75a2b0b1e9688670 # v2.7.1

      # -----------------------------------------------------------------------
      # 1. Checkout
      #    fetch-depth: 0 for the same reason as sdk-cleartext-tests.yml:
      #    the build reads vendored files from this repository's history.
      # -----------------------------------------------------------------------
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Called from main, github.ref is main's: check out the branch that was asked for. Empty on
          # a manual run, which checks out the branch it was started on.
          ref: ${{ inputs.ref }}
          persist-credentials: 'false'
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '>=22.23.4 <23'

      - name: Install safe-chain
        shell: bash
        run: curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.3/install-safe-chain.sh | sh -s -- --ci

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.5.1

      - name: Update npm
        run: npm install -g npm@11.7.0

      - name: Install dependencies
        run: make install-ci

      # -----------------------------------------------------------------------
      # 2. Compile
      #    Only what the tests need. The gates of `make build-ci` (lint, format,
      #    generated files) belong to the pull request run: a night run that
      #    went red on one of them would say nothing about the chains.
      # -----------------------------------------------------------------------
      - name: Compile
        run: make compile

      # -----------------------------------------------------------------------
      # 3. Test the chains
      #    --latest holds every test that reaches a live chain at its latest
      #    block; no test with "ci": true can be one of them. --no-wallet leaves
      #    out the tests that send transactions and spend the funds of an
      #    account. --strict fails the run before any test starts when an RPC
      #    URL is missing: without it, each test of that chain would be
      #    "unavailable" and the run would pass having tested nothing.
      #
      #    The tests read the RPC URL of each chain from SEPOLIA_RPC_URL,
      #    MAINNET_RPC_URL or ARBITRUM_RPC_URL. The step builds the three
      #    QuickNode URLs from two secrets, FHEVM_QUICKNODE_ENDPOINT_NAME and
      #    FHEVM_QUICKNODE_TOKEN_ID:
      #      https://<endpoint>.<network>.quiknode.pro/<token>
      #    The network is ethereum-sepolia for Sepolia and arbitrum-mainnet for
      #    Arbitrum One. Ethereum mainnet has no network part:
      #      https://<endpoint>.quiknode.pro/<token>
      #    The engine gives each test only the variables of the chains it
      #    declares. When either secret is missing, the three variables are
      #    empty, and --strict fails the run before any test starts.
      #
      #    BSC_TESTNET_RPC_URL (bsc-testnet, chain 97) and POLYGON_AMOY_RPC_URL
      #    (matic-amoy, chain 80002) are built the same way, for later: no test
      #    of the inventory declares these chains yet, and the engine does not
      #    know their variables, so it neither requires nor withholds them.
      # -----------------------------------------------------------------------
      - name: Test the chains at their latest block
        env:
          SEPOLIA_RPC_URL: ${{ secrets.FHEVM_QUICKNODE_ENDPOINT_NAME != '' && secrets.FHEVM_QUICKNODE_TOKEN_ID != '' && format('https://{0}.ethereum-sepolia.quiknode.pro/{1}', secrets.FHEVM_QUICKNODE_ENDPOINT_NAME, secrets.FHEVM_QUICKNODE_TOKEN_ID) || '' }}
          MAINNET_RPC_URL: ${{ secrets.FHEVM_QUICKNODE_ENDPOINT_NAME != '' && secrets.FHEVM_QUICKNODE_TOKEN_ID != '' && format('https://{0}.quiknode.pro/{1}', secrets.FHEVM_QUICKNODE_ENDPOINT_NAME, secrets.FHEVM_QUICKNODE_TOKEN_ID) || '' }}
          ARBITRUM_RPC_URL: ${{ secrets.FHEVM_QUICKNODE_ENDPOINT_NAME != '' && secrets.FHEVM_QUICKNODE_TOKEN_ID != '' && format('https://{0}.arbitrum-mainnet.quiknode.pro/{1}', secrets.FHEVM_QUICKNODE_ENDPOINT_NAME, secrets.FHEVM_QUICKNODE_TOKEN_ID) || '' }}
          BSC_TESTNET_RPC_URL: ${{ secrets.FHEVM_QUICKNODE_ENDPOINT_NAME != '' && secrets.FHEVM_QUICKNODE_TOKEN_ID != '' && format('https://{0}.bsc-testnet.quiknode.pro/{1}', secrets.FHEVM_QUICKNODE_ENDPOINT_NAME, secrets.FHEVM_QUICKNODE_TOKEN_ID) || '' }}
          POLYGON_AMOY_RPC_URL: ${{ secrets.FHEVM_QUICKNODE_ENDPOINT_NAME != '' && secrets.FHEVM_QUICKNODE_TOKEN_ID != '' && format('https://{0}.matic-amoy.quiknode.pro/{1}', secrets.FHEVM_QUICKNODE_ENDPOINT_NAME, secrets.FHEVM_QUICKNODE_TOKEN_ID) || '' }}
        run: |
          ulimit -n 65536
          ./fhevm-npm-cli test-engine run --inventory ALL_TESTS.json --latest --no-wallet --strict --verbose --max-lanes 4

      - name: Keep the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-engine-latest-report
          path: test-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Keep the logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-engine-latest-logs
          path: test-logs/
          if-no-files-found: warn
          retention-days: 14
