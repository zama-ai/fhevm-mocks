name: sdk-cleartext-tests

# The suite of sdk-cleartext-tests-nightly.yml, with its tests run by the test engine of fhevm-npm instead of
# `make test`, `make test-consumer-ci` and `make test-anvil-ci`. The engine runs every test that
# ALL_TESTS.json marks for CI, in four lanes side by side.
#
# The gate of every pull request to release/0.14.x: its test job reports `sdk-cleartext-tests/test (bpr)`,
# the check that the branch ruleset requires. sdk-cleartext-tests-nightly.yml reported it before, and now
# runs once a night. The trigger, the path filter and the concurrency are those it had on pull requests.
on:
  pull_request:
    branches:
      - release/0.14.x
    # Deliberately no `paths:` here: the `changes` job below filters. A workflow skipped by a path
    # filter reports no check at all, so the required `sdk-cleartext-tests/test (bpr)` would stay
    # pending forever and the PR could not merge. A job skipped by an `if:` reports "skipped", which
    # the ruleset counts as a pass.
  workflow_dispatch:

# No permissions at the workflow level — each job declares only what it needs.
permissions: {}

# A newer push to the same PR makes the running job pointless, so cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Harden every `npm ci` inside `make install-ci` against transient registry blips such as
# ECONNRESET / "network aborted", the same way js-sdk-dod.yml does.
env:
  NPM_CONFIG_FETCH_RETRIES: '5'
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: '20000'
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '120000'
  NPM_CONFIG_FETCH_TIMEOUT: '600000'

jobs:
  # ---------------------------------------------------------------------------
  # Does this PR touch anything a test could observe?
  #
  # Cheap ubuntu runner, no checkout: dorny reads the PR's file list from the API.
  # Its answer gates the expensive job below, which is the whole point — a skipped
  # job still reports its check, so the required gate is satisfied either way.
  #
  # Everything is assumed test-affecting; the filter only ever subtracts. Each exclusion
  # is a claim that no check or test reads those files, so it has to stay true as the repo
  # moves — keep the list short.
  # ---------------------------------------------------------------------------
  changes:
    name: sdk-cleartext-tests/changes
    # Only a pull request has a file list to read from the API. A manual run is someone
    # asking for the suite on purpose, so it skips straight past this and tests everything.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: 'read' # Required to read the file list of the pull request
    outputs:
      payload: ${{ steps.filter.outputs.payload }}
    steps:
      - name: Filter changed paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # WITHOUT this the patterns below are OR-ed, a negated pattern is just "any file
          # that isn't X", and `payload` comes out true for every changed file — the
          # exclusions would silently do nothing. `every` is what turns them into real
          # exclusions: a file counts only if it matches ALL of them.
          #
          # So ONLY negated patterns belong in this list. Adding a positive one means every
          # file would also have to match that, and the filter would go quiet.
          # `every` needs v3.0.4; the v3.0.2 pinned elsewhere in the org has no such input.
          predicate-quantifier: 'every'
          filters: |
            payload:
              # Publishing is a separate workflow reached by workflow_call. Nothing in
              # it is imported, compiled or asserted on by the suite.
              - '!.github/workflows/sdk-cleartext-publish-*.yml'
              # Prose only: no check or test reads these.
              - '!fhevm-npm-docs/**'
              # The rules, definitions, and issues: Markdown the suite does not read.
              # sdk-cleartext-docs.yml checks them, and the links of every .md file, on every pull
              # request, so a prose-only pull request still gets that check while skipping this suite.
              - '!rules/**'
              # Markdown that nothing in the suite reads: prettier-ignored (`*.md` in the package's own
              # .prettierignore, or no prettier run at all), generated by nothing, outside every
              # npm payload and every vendored-origin pin. NOT a blanket `**/*.md`: CI does read
              # some Markdown, so these stay in the suite:
              #   - host-contracts-cleartext/<vN-1>/**, every file of it (`check generation-parity`).
              #     At the next rotation <vN> becomes <vN-1>: drop its two lines below then.
              #   - each payload's pkg/README.md (`check published-files` requires it).
              #   - the READMEs of fhevm-npm/, hardhat/**/plugin/ and the templates' pkg/ (prettier).
              - '!CHANGELOG.md'
              - '!host-contracts-cleartext/v14/*.md'
              - '!host-contracts-cleartext/v14/create2-deploy/**/*.md'
              - '!foundry/forge-fhevm-std/test/**/*.md'
              - '!operators-data/**/*.md'
              # Deployment records: data no build or test reads. sdk-cleartext-deployments.yml
              # checks them on every pull request, whatever else it changes.
              - '!deployments/**'

  run-tests:
    # The name the ruleset of release/0.14.x requires. Rename it only together with that ruleset.
    name: sdk-cleartext-tests/test (bpr)
    needs: changes
    # As in sdk-cleartext-tests-nightly.yml: only an explicit `false` skips the suite. A skipped filter (manual
    # run) or a failed one leaves this empty, and the tests run anyway.
    if: ${{ !cancelled() && needs.changes.outputs.payload != 'false' }}
    # The runner js-sdk-tests.yml uses: runs-on.io, 4 vCPU, with the S3-backed cache extra. Its 4 vCPU
    # match the 4 lanes of the run.
    runs-on: runs-on=${{ github.run_id }}/runner=4cpu-linux-x64/extras=s3-cache
    # A laptop takes about 30 minutes for the build and the tests. Generous until a real run says otherwise.
    timeout-minutes: 120
    permissions:
      contents: 'read' # Required to checkout repository code
    steps:
      # -----------------------------------------------------------------------
      # 0. RunsOn
      #    Required by `extras=s3-cache`, and it must be the first step. The
      #    runner points ACTIONS_RESULTS_URL at the local RunsOn cache proxy,
      #    and only this action gives that proxy the real GitHub results URL.
      #    Without it, every actions/upload-artifact call below fails with
      #    `Unexpected token 'O', "Original A"... is not valid JSON`.
      #    The same pin as the workflows of zama-ai/kms.
      # -----------------------------------------------------------------------
      - name: Set up RunsOn
        uses: runs-on/action@4a3bfc79f21a9b97e972e2ba75a2b0b1e9688670 # v2.7.1

      # -----------------------------------------------------------------------
      # 1. Checkout
      #    Pinned to a full commit SHA (not a mutable tag) to prevent supply
      #    chain attacks. persist-credentials: false removes the Git token from
      #    the local config so subsequent steps can't accidentally leak it.
      #    fetch-depth: 0 is required here, unlike most workflows in this repo:
      #    `make generate` runs `check-vendored-origin`, which reads vendored
      #    files straight out of this repo's own git history at their pinned
      #    origin commit (`git show <commit>:<path>`) to prove the vendored
      #    copy still matches. A shallow checkout doesn't have that commit,
      #    and the read fails with "unavailable locally".
      # -----------------------------------------------------------------------
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # 2. Node.js setup
      #    The workspace requires Node >=22.6 (declared in package.json
      #    "engines"). 22.x resolves to the latest 22, which matters here:
      #    ./fhevm-npm-cli runs a .ts entry point with no flags and relies on
      #    Node's built-in type stripping, on by default from 22.18. The test
      #    engine is part of ./fhevm-npm-cli.
      #    UNLIKE js-sdk-tests.yml there is no registry-url: nothing in a test
      #    run authenticates to a registry.
      # -----------------------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '>=22.23.4 <23'

      # -----------------------------------------------------------------------
      # 3. safe-chain
      #    Aikido's supply-chain monitor. Hooks into npm install so that any
      #    package with a known-malicious checksum is blocked before it can
      #    execute. --ci makes it exit non-zero on any violation instead of
      #    prompting interactively, and installs PATH shims rather than shell
      #    aliases, so the npm runs inside `make` are covered too.
      # -----------------------------------------------------------------------
      - name: Install safe-chain
        shell: bash
        run: curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.3/install-safe-chain.sh | sh -s -- --ci

      # -----------------------------------------------------------------------
      # 4. Foundry
      #    Needed by the install (forge soldeer), the compiles and the tests.
      #    It also gives anvil, which the test engine starts for each test
      #    whose node the engine starts.
      #    `forge --version` reports the ref it was built from, so a tag says
      #    "1.5.1-v1.5.1" and the stable channel says "1.5.1-stable".
      #    check-foundry compares that whole string against
      #    npm-manifest.json#foundry.version, so both must use the tag — and
      #    both must be bumped together. Locally: foundryup --install v1.5.1
      # -----------------------------------------------------------------------
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.5.1

      # -----------------------------------------------------------------------
      # 5. Upgrade npm
      #    Pin to the same version as the sibling js-sdk and library-solidity
      #    workflows, so a lockfile written by one is read by the same npm in
      #    all of them. Nothing here publishes, so this is about `npm ci`
      #    behaving identically everywhere, not about provenance.
      # -----------------------------------------------------------------------
      - name: Update npm
        run: npm install -g npm@11.7.0

      # -----------------------------------------------------------------------
      # 6. Install dependencies
      #    npm ci is strict and deterministic: it installs exactly what is in
      #    package-lock.json, fails if the lockfile is out of sync, and never
      #    modifies it. UNLIKE js-sdk-tests.yml one `npm ci` is not enough: this
      #    workspace has four installation roots (sdk, fhevm-npm, hardhat/v2,
      #    hardhat/v3) because hardhat's environment is per-module and each
      #    major needs its own singleton. `make install-ci` runs npm ci in each,
      #    then the forge dependencies, because the Makefile owns which roots
      #    exist.
      # -----------------------------------------------------------------------
      - name: Install dependencies
        run: make install-ci

      # -----------------------------------------------------------------------
      # 6b. Install mlc
      #    `check md-links`, which `make check-pre` runs, checks the .md links
      #    with mlc (Markup Link Checker, https://github.com/becheran/mlc) and
      #    skips with a warning when mlc is missing. Installed so the check
      #    really runs here: pinned and built from source as tfhe-rs installs
      #    it. Keep the version equal to the one in sdk-cleartext-docs.yml.
      # -----------------------------------------------------------------------
      - name: Install mlc
        run: cargo install --locked --version 1.3.0 mlc

      # -----------------------------------------------------------------------
      # 7. Build everything
      #    `build-ci` is every gate except the tests, in the Makefile's order:
      #    clean, check-generated (delete + regenerate + require a spotless
      #    tree), check-pre, check-vendored-origin, build (fmt-check, lint,
      #    compile of every package), check-post. It refuses to start on a
      #    dirty worktree, which is also what proves `make install-ci` left
      #    none of the committed files touched.
      #
      #    The same step as in sdk-cleartext-tests-nightly.yml. It is its own step, and
      #    not the `--build` option of the engine, so that the summary names
      #    the build when the build is what went red.
      # -----------------------------------------------------------------------
      - name: Build everything
        run: make build-ci

      # -----------------------------------------------------------------------
      # 8. Test everything
      #    The test engine runs every test of ALL_TESTS.json with "ci": true, in
      #    four lanes side by side: the tests of every package, the consumer
      #    rehearsal, and the anvil suite. These are steps 8, 9 and 10 of
      #    sdk-cleartext-tests-nightly.yml, plus the fork tests. It builds nothing: the
      #    build of step 7 is the one it tests.
      #
      #    --no-latest leaves out every test that reaches a live chain at its
      #    latest block: a chain moves on its own schedule, so such a test can
      #    fail with no change in the pull request. The engine already refuses
      #    such a test with "ci": true; the flag says it here too. A fork test
      #    runs here only at a pinned block.
      #
      #    The engine orders what `make ci` orders by hand. Tests that state one
      #    port, such as the consumer rehearsals and an anvil suite, never run at
      #    the same time. Each test whose node the engine starts gets a new one.
      #
      #    --verbose prints the output of every test, each line with the ID of
      #    its test in front. The lanes run at the same time, so their lines mix;
      #    test-logs/<id>.log holds each test in order, and step 12 keeps it.
      #
      #    The tests that need a live chain read its RPC URL from
      #    SEPOLIA_RPC_URL, MAINNET_RPC_URL or ARBITRUM_RPC_URL. With
      #    --no-latest, those are the fork tests at a pinned block, so the RPC
      #    must serve the state of old blocks. The step builds the QuickNode
      #    URLs from two secrets, FHEVM_QUICKNODE_ENDPOINT_NAME and
      #    FHEVM_QUICKNODE_TOKEN_ID (zama-ai/fhevm-mocks#261):
      #      https://<endpoint>.<network>.quiknode.pro/<token>
      #    The network is ethereum-sepolia for Sepolia and arbitrum-mainnet for
      #    Arbitrum One. Ethereum mainnet has no network part:
      #      https://<endpoint>.quiknode.pro/<token>
      #    BSC_TESTNET_RPC_URL (bsc-testnet) and POLYGON_AMOY_RPC_URL
      #    (matic-amoy) are built the same way, for later: no test declares
      #    these chains yet. The engine gives each test only the variables of
      #    the chains it declares.
      #
      #    --no-wallet: no test here sends transactions or spends the funds of
      #    an account. Such a test reaches a remote chain, which is always at
      #    its latest block, so it cannot have "ci": true anyway; the flag says
      #    it here too.
      #
      #    No --strict, unlike sdk-cleartext-tests-latest-nightly.yml: a pull
      #    request from a fork or from Dependabot gets no repository secret.
      #    Its variables are then empty, the engine marks the live-chain tests
      #    "unavailable" and does not start them, and the run still passes.
      #    FHEVM_SKIP_RPC_TESTS is not set here, unlike
      #    sdk-cleartext-tests-nightly.yml: the offline forge suite sets it in
      #    its own script, and setting it here would make a fork test skip
      #    even with a URL.
      #
      #    The ulimit is the js-sdk workflow's: hardhat and forge open many files
      #    at once under the harness tests.
      # -----------------------------------------------------------------------
      - name: Test everything
        env:
          SEPOLIA_RPC_URL: ${{ secrets.FHEVM_QUICKNODE_ENDPOINT_NAME != '' && secrets.FHEVM_QUICKNODE_TOKEN_ID != '' && format('https://{0}.ethereum-sepolia.quiknode.pro/{1}', secrets.FHEVM_QUICKNODE_ENDPOINT_NAME, secrets.FHEVM_QUICKNODE_TOKEN_ID) || '' }}
          MAINNET_RPC_URL: ${{ secrets.FHEVM_QUICKNODE_ENDPOINT_NAME != '' && secrets.FHEVM_QUICKNODE_TOKEN_ID != '' && format('https://{0}.quiknode.pro/{1}', secrets.FHEVM_QUICKNODE_ENDPOINT_NAME, secrets.FHEVM_QUICKNODE_TOKEN_ID) || '' }}
          ARBITRUM_RPC_URL: ${{ secrets.FHEVM_QUICKNODE_ENDPOINT_NAME != '' && secrets.FHEVM_QUICKNODE_TOKEN_ID != '' && format('https://{0}.arbitrum-mainnet.quiknode.pro/{1}', secrets.FHEVM_QUICKNODE_ENDPOINT_NAME, secrets.FHEVM_QUICKNODE_TOKEN_ID) || '' }}
          BSC_TESTNET_RPC_URL: ${{ secrets.FHEVM_QUICKNODE_ENDPOINT_NAME != '' && secrets.FHEVM_QUICKNODE_TOKEN_ID != '' && format('https://{0}.bsc-testnet.quiknode.pro/{1}', secrets.FHEVM_QUICKNODE_ENDPOINT_NAME, secrets.FHEVM_QUICKNODE_TOKEN_ID) || '' }}
          POLYGON_AMOY_RPC_URL: ${{ secrets.FHEVM_QUICKNODE_ENDPOINT_NAME != '' && secrets.FHEVM_QUICKNODE_TOKEN_ID != '' && format('https://{0}.matic-amoy.quiknode.pro/{1}', secrets.FHEVM_QUICKNODE_ENDPOINT_NAME, secrets.FHEVM_QUICKNODE_TOKEN_ID) || '' }}
        run: |
          ulimit -n 65536
          ./fhevm-npm-cli test-engine run --inventory ALL_TESTS.json --ci --no-latest --no-wallet --verbose --max-lanes 4

      # -----------------------------------------------------------------------
      # 8b. Check that the tests left the worktree clean
      #    Step 7 ends on a clean worktree: `check-generated` requires one, and
      #    git ignores every build output. A test that leaves a file behind or
      #    changes a tracked one, such as a lockfile a consumer test rewrites,
      #    fails here. The engine's own outputs, test-report.json and
      #    test-logs/, are ignored by git. It runs after a failed test step too.
      # -----------------------------------------------------------------------
      - name: Check that the tests left the worktree clean
        if: ${{ !cancelled() }}
        run: |
          changes="$(git status --porcelain)"
          if [ -n "${changes}" ]; then
            echo "::error::The tests left the working tree changed. Each test must leave it as it found it."
            printf '%s\n' "${changes}"
            git --no-pager diff --stat
            exit 1
          fi
          echo "✅ The tests left the working tree clean."

      # -----------------------------------------------------------------------
      # 9. Check the report
      #    The report of the run gives every selected test one state, and no
      #    test with "ci": true is missing from it. Every engine step names the
      #    inventory: `run` and `duplicates` would read ALL_TESTS.json without
      #    it, but `check-report` compares the report with an inventory only
      #    when one is given.
      # -----------------------------------------------------------------------
      - name: Check the report
        if: ${{ !cancelled() }}
        run: ./fhevm-npm-cli test-engine check-report test-report.json --inventory ALL_TESTS.json --ci

      # -----------------------------------------------------------------------
      # 10. Check that no test case runs twice
      #    Lists, without running them, the forge functions that each test
      #    selects, and fails on a function that two tests select. It reads the
      #    workspace that step 7 built, and takes about 20 seconds.
      #
      #    Every test of the inventory, not only those with "ci": true: it runs
      #    no test, so a test that only a run of --latest holds is checked too.
      # -----------------------------------------------------------------------
      - name: Check that no test case runs twice
        if: ${{ !cancelled() }}
        run: ./fhevm-npm-cli test-engine duplicates --inventory ALL_TESTS.json

      # -----------------------------------------------------------------------
      # 11. Keep the report
      #    test-report.json gives the state, the duration and the lane of each
      #    test. Kept after every run, for 14 days: it is small, and its
      #    durations show where the time of a run goes.
      # -----------------------------------------------------------------------
      - name: Keep the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-engine-report
          path: test-report.json
          if-no-files-found: warn
          retention-days: 14

      # -----------------------------------------------------------------------
      # 12. Keep the logs
      #    test-logs/ holds one log per test, in order, and the last lines of
      #    each node that the engine started, which the output of step 8 does
      #    not show. Kept only when the run failed, for 14 days: that is when
      #    they are read.
      # -----------------------------------------------------------------------
      - name: Keep the logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-engine-logs
          path: test-logs/
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Lint the workflows themselves, on their own runner.
  #
  # The same job as in sdk-cleartext-tests-nightly.yml, so that this workflow can replace it without
  # dropping the lint. It is not a step of run-tests: it needs no build, so it should not wait
  # behind one.
  #
  # zizmor-action uploads its findings as SARIF through codeql-action, so they land in the
  # repository's code-scanning view like every other SAST result in the org. That upload is what
  # `security-events: write` is for.
  # ---------------------------------------------------------------------------
  zizmor:
    name: sdk-cleartext-tests/zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: 'read' # Required to checkout repository code
      security-events: 'write' # Required to write security events for SAST results
    steps:
      # A shallow checkout is enough: zizmor reads the workflow files as they are.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'

      - name: Run zizmor 🌈
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          persona: pedantic
          version: 1.17.0
