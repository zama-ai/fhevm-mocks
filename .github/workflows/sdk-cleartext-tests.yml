name: sdk-cleartext-tests

on:
  pull_request:
    branches:
      - release/0.14.x
    # Deliberately no `paths:` here — the equivalent filtering lives in the `changes`
    # job below. A workflow skipped by a path filter reports NO check at all, so the
    # required `sdk-cleartext-tests/test (bpr)` gate would stay pending forever and the
    # PR would be unmergeable. A job skipped by an `if:` reports "skipped", which branch
    # protection counts as a pass.
  workflow_dispatch:

# No permissions at the workflow level — each job declares only what it needs.
permissions: {}

# A newer push to the same PR makes the running job pointless, so cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Harden every `npm ci` inside `make install-ci` against transient registry blips such as
# ECONNRESET / "network aborted", the same way js-sdk-dod.yml does.
env:
  NPM_CONFIG_FETCH_RETRIES: '5'
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: '20000'
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '120000'
  NPM_CONFIG_FETCH_TIMEOUT: '600000'

jobs:
  # ---------------------------------------------------------------------------
  # Does this PR touch anything a test could observe?
  #
  # Cheap ubuntu runner, no checkout: dorny reads the PR's file list from the API.
  # Its answer gates the expensive job below, which is the whole point — a skipped
  # job still reports its check, so the required gate is satisfied either way.
  #
  # Everything is assumed test-affecting; the filter only ever subtracts. Each exclusion
  # is a claim that no check or test reads those files, so it has to stay true as the repo
  # moves — keep the list short.
  # ---------------------------------------------------------------------------
  changes:
    name: sdk-cleartext-tests/changes
    # Only a pull request has a file list to read from the API. A manual run is someone
    # asking for the suite on purpose, so it skips straight past this and tests everything.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: 'read' # Required to read the file list of the pull request
    outputs:
      payload: ${{ steps.filter.outputs.payload }}
    steps:
      - name: Filter changed paths
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          # WITHOUT this the patterns below are OR-ed, a negated pattern is just "any file
          # that isn't X", and `payload` comes out true for every changed file — the
          # exclusions would silently do nothing. `every` is what turns them into real
          # exclusions: a file counts only if it matches ALL of them.
          #
          # So ONLY negated patterns belong in this list. Adding a positive one means every
          # file would also have to match that, and the filter would go quiet.
          # `every` needs v3.0.4; the v3.0.2 pinned elsewhere in the org has no such input.
          predicate-quantifier: 'every'
          filters: |
            payload:
              # Publishing is a separate workflow reached by workflow_call. Nothing in
              # it is imported, compiled or asserted on by the suite.
              - '!.github/workflows/sdk-cleartext-publish-*.yml'
              # Prose only: no check or test reads these.
              - '!fhevm-npm-docs/**'

  run-tests:
    name: sdk-cleartext-tests/test (bpr)
    needs: changes
    # Only an explicit `false` skips the suite. A skipped filter (manual run) or a failed
    # one (dorny erroring, the API refusing) leaves this empty and the tests run anyway —
    # a broken filter must not be able to wave a PR through a gate that never executed.
    # Naming a status function is also what stops a skipped dependency from skipping this
    # job by default, which is what lets a manual run reach the suite at all.
    if: ${{ !cancelled() && needs.changes.outputs.payload != 'false' }}
    # The runner js-sdk-tests.yml uses: runs-on.io, 4 vCPU, with the S3-backed cache extra.
    runs-on: runs-on=${{ github.run_id }}/runner=4cpu-linux-x64/extras=s3-cache
    # `make ci` takes about an hour and a half on a laptop. Generous until a real run says otherwise.
    timeout-minutes: 180
    permissions:
      contents: 'read' # Required to checkout repository code
    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout
      #    Pinned to a full commit SHA (not a mutable tag) to prevent supply
      #    chain attacks. persist-credentials: false removes the Git token from
      #    the local config so subsequent steps can't accidentally leak it.
      #    fetch-depth: 0 is required here, unlike most workflows in this repo:
      #    `make generate` runs `check-vendored-origin`, which reads vendored
      #    files straight out of this repo's own git history at their pinned
      #    origin commit (`git show <commit>:<path>`) to prove the vendored
      #    copy still matches. A shallow checkout doesn't have that commit,
      #    and the read fails with "unavailable locally".
      # -----------------------------------------------------------------------
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: 'false'
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # 2. Node.js setup
      #    The workspace requires Node >=22.6 (declared in package.json
      #    "engines"). 22.x resolves to the latest 22, which matters here:
      #    ./fhevm-npm-cli runs a .ts entry point with no flags and relies on
      #    Node's built-in type stripping, on by default from 22.18.
      #    UNLIKE js-sdk-tests.yml there is no registry-url: nothing in a test
      #    run authenticates to a registry.
      # -----------------------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 22.x

      # -----------------------------------------------------------------------
      # 3. safe-chain
      #    Aikido's supply-chain monitor. Hooks into npm install so that any
      #    package with a known-malicious checksum is blocked before it can
      #    execute. --ci makes it exit non-zero on any violation instead of
      #    prompting interactively, and installs PATH shims rather than shell
      #    aliases, so the npm runs inside `make` are covered too.
      # -----------------------------------------------------------------------
      - name: Install safe-chain
        shell: bash
        run: curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.3/install-safe-chain.sh | sh -s -- --ci

      # -----------------------------------------------------------------------
      # 4. Foundry
      #    Needed by the install (forge soldeer), the compiles and the tests.
      #    `forge --version` reports the ref it was built from, so a tag says
      #    "1.5.1-v1.5.1" and the stable channel says "1.5.1-stable".
      #    check-foundry compares that whole string against
      #    npm-manifest.json#foundry.version, so both must use the tag — and
      #    both must be bumped together. Locally: foundryup --install v1.5.1
      # -----------------------------------------------------------------------
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@82dee4ba654bd2146511f85f0d013af94670c4de # v1.4.0
        with:
          version: v1.5.1

      # -----------------------------------------------------------------------
      # 5. Upgrade npm
      #    Pin to the same version as the sibling js-sdk and library-solidity
      #    workflows, so a lockfile written by one is read by the same npm in
      #    all of them. Nothing here publishes, so this is about `npm ci`
      #    behaving identically everywhere, not about provenance.
      # -----------------------------------------------------------------------
      - name: Update npm
        run: npm install -g npm@11.7.0

      # -----------------------------------------------------------------------
      # 6. Install dependencies
      #    npm ci is strict and deterministic: it installs exactly what is in
      #    package-lock.json, fails if the lockfile is out of sync, and never
      #    modifies it. UNLIKE js-sdk-tests.yml one `npm ci` is not enough: this
      #    workspace has four installation roots (sdk, fhevm-npm, hardhat/v2,
      #    hardhat/v3) because hardhat's environment is per-module and each
      #    major needs its own singleton. `make install-ci` runs npm ci in each,
      #    then the forge dependencies, because the Makefile owns which roots
      #    exist.
      # -----------------------------------------------------------------------
      - name: Install dependencies
        run: make install-ci

      # -----------------------------------------------------------------------
      # 7. Build everything
      #    `build-ci` is every gate except the tests, in the Makefile's order:
      #    clean, check-generated (delete + regenerate + require a spotless
      #    tree), check-pre, check-vendored-origin, build (fmt-check, lint,
      #    compile of every package), check-post. It refuses to start on a
      #    dirty worktree, which is also what proves `make install-ci` left
      #    none of the committed files touched.
      # -----------------------------------------------------------------------
      - name: Build everything
        run: make build-ci

      # -----------------------------------------------------------------------
      # 8. Test everything
      #    Every package's unit, forge and harness tests, in dependency order.
      #    The suites that need a local node are NOT here: they are their own tier,
      #    in step 10 below.
      #
      #    FHEVM_SKIP_RPC_TESTS keeps this lane OFFLINE. forge-fhevm-std commits an
      #    `[rpc_endpoints] sepolia` in its foundry.toml, so `hasRpcUrlFor` is always
      #    true and the per-suite opt-in can never skip on its own; without this the
      #    default `forge test` calls a public endpoint on every push and goes red for
      #    reasons unrelated to the change (rate limits, and pruned state under any
      #    pinned block). The network suites are run deliberately instead, by
      #    `make test-forge-std-fork` / `test-forge-std-fork-url`.
      #
      #    The ulimit is the js-sdk workflow's: hardhat and forge open many files
      #    at once under the harness tests.
      # -----------------------------------------------------------------------
      - name: Test everything
        env:
          FHEVM_SKIP_RPC_TESTS: 'true'
        run: |
          ulimit -n 65536
          make test

      # -----------------------------------------------------------------------
      # 9. Consumer rehearsal
      #    Installs every consumer registered in npm-manifest.json#consumerTests
      #    into an isolated temp directory and runs its suite, replaying each
      #    committed lockfile — the closest thing to a publish rehearsal that
      #    never reaches npmjs.com. Both hardhat templates are workspace members
      #    with no lockfile by policy and resolve fresh. Steps 7, 8, 9 and 10 are
      #    what `make ci` runs; they are separate steps only so the summary
      #    names the phase that went red.
      # -----------------------------------------------------------------------
      - name: Consumer rehearsal
        run: make test-consumer-ci

      # -----------------------------------------------------------------------
      # 10. Anvil suite
      #    forge-fhevm-std's anvil suite, which needs a local EVM node. It starts
      #    and stops its own through scripts/with-anvil.sh, so there is no service
      #    to declare here and nothing is left listening afterwards. anvil itself
      #    comes from the foundry toolchain installed in step 4 — no extra install.
      #
      #    `test-anvil-ci` is a SUBSET of the `test-anvil` tier: the two hardhat
      #    e2e suites against anvil pass but cost ~4 minutes each, so they are not
      #    yet paid for on every push. The Makefile target says how to promote one.
      #
      #    AFTER the consumer rehearsal on purpose: those rehearsals assert that
      #    nothing holds port 8545 and fail outright if something does, and this
      #    tier binds a node. `make ci` orders it the same way.
      # -----------------------------------------------------------------------
      - name: Anvil suite
        run: |
          ulimit -n 65536
          make test-anvil-ci

  # ---------------------------------------------------------------------------
  # Lint the workflows themselves — always, on its own runner.
  #
  # Deliberately NOT a step of run-tests: that job is skipped on PRs that touch only
  # the publish workflows, which is precisely when a workflow linter has the most to
  # say. It also needs no build, so it should not sit behind ninety minutes of one.
  #
  # zizmor-action uploads its findings as SARIF through codeql-action, so they land in
  # the repository's code-scanning view like every other SAST result in the org. That
  # upload is what `security-events: write` is for — same shape as common-pull-request-lint.
  # ---------------------------------------------------------------------------
  zizmor:
    name: sdk-cleartext-tests/zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: 'read' # Required to checkout repository code
      security-events: 'write' # Required to write security events for SAST results
    steps:
      # A shallow checkout is enough: zizmor reads the workflow files as they are.
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: 'false'

      - name: Run zizmor 🌈
        uses: zizmorcore/zizmor-action@e673c3917a1aef3c65c972347ed84ccd013ecda4 # v0.2.0
        with:
          persona: pedantic
          version: 1.17.0
