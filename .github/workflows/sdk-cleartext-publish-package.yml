name: sdk-cleartext-publish-package

on:
  workflow_call:
    inputs:
      build_target:
        description: 'compile-cleartext-v-cur, compile-hh-v2-plugin, compile-hh-v3-plugin, compile-forge-std'
        required: true
        type: string
      dry_run:
        description: 'run every step but stop short of publishing'
        required: false
        default: true
        type: boolean
      latest:
        description: 'publish X.Y.Z as npm latest; false publishes it as next (X.Y.Z-A is always alpha)'
        required: false
        default: true
        type: boolean
    secrets:
      NPM_TOKEN:
        required: true

# No permissions at the workflow level — each job declares only what it needs.
permissions: {}

# Two jobs, so that no third-party code ever runs next to a credential:
#   build    installs dependencies (whose install scripts run), builds, packs and checks the tarball.
#            It holds no secret and no id-token: a malicious dependency finds nothing to steal and
#            cannot request an OIDC token to sign arbitrary files as this workflow.
#   publish  holds the npm token and id-token, but never checks out the repository or installs a
#            dependency: it downloads the checked tarball, verifies its digest, and publishes it.
# What this cannot prevent: a compromised build producing a malicious tarball. The split protects the
# credentials, not the build output.

jobs:
  build:
    name: sdk-publish-payload/build
    runs-on: ubuntu-latest
    permissions:
      contents: 'read' # Required to checkout repository code
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
      dist_tag: ${{ steps.release_meta.outputs.dist_tag }}
      name: ${{ steps.artifact.outputs.name }}
      artifact: ${{ steps.artifact.outputs.artifact }}
      tarball: ${{ steps.artifact.outputs.tarball }}
      sha256: ${{ steps.artifact.outputs.sha256 }}
    steps:
      # -----------------------------------------------------------------------
      # 0. Branch gate
      #    Publish only from this branch's own release line. workflow_dispatch
      #    lets anyone with write access pick any ref, which would publish
      #    unreviewed code with the real token and a genuine provenance
      #    attestation. In a reusable workflow github.ref is the caller's ref,
      #    so this one step covers every publish workflow. Runs before checkout:
      #    nothing from the refused ref is ever fetched or executed.
      #    Update ALLOWED_REF when this file is carried to another release line.
      # -----------------------------------------------------------------------
      - name: Refuse any branch but the release line
        env:
          REF: ${{ github.ref }}
          ALLOWED_REF: refs/heads/release/0.13.x
        run: |
          if [[ "$REF" != "$ALLOWED_REF" ]]; then
            echo "::error::publishing is only allowed from ${ALLOWED_REF#refs/heads/}; this run is on ${REF}"
            exit 1
          fi
          echo "Publishing from ${REF}"

      # -----------------------------------------------------------------------
      # 1. Checkout
      #    Pinned to a full commit SHA (not a mutable tag) to prevent supply
      #    chain attacks. persist-credentials: false removes the Git token from
      #    the local config so subsequent steps can't accidentally leak it.
      #    The default shallow checkout is sufficient: publishing consumes
      #    committed generated sources; CI validates their vendored origin.
      # -----------------------------------------------------------------------
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: 'false'

      # -----------------------------------------------------------------------
      # 2. Node.js setup
      #    The SDK requires Node >=22.6 (declared in package.json "engines").
      #    22.x resolves to the latest 22, which matters: ./fhevm-npm-cli runs a
      #    .ts entry point with no flags and relies on Node's built-in type
      #    stripping, on by default from 22.18.
      #    No registry-url: nothing here authenticates through NODE_AUTH_TOKEN.
      #    `publish check` reads npmjs.com anonymously and block 8 receives the
      #    token directly.
      # -----------------------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 22.x

      # -----------------------------------------------------------------------
      # 2b. Choose the package, version and npm tag
      #     compile-cleartext-v-cur -> current host-contracts-cleartext version
      #     compile-hh-v2-plugin    -> Hardhat 2 plugin
      #     compile-hh-v3-plugin    -> Hardhat 3 plugin
      #     compile-forge-std       -> Forge Fhevm
      #     The current contracts directory comes from npm-manifest.json.
      #     The version comes from versions.json, the tag from it and `latest`:
      #       X.Y.Z-A                -> alpha
      #       X.Y.Z, latest = true   -> latest
      #       X.Y.Z, latest = false  -> next (a stable release not promoted yet;
      #                                 npm moves `next` off its previous holder)
      #     Guard: an X.Y.Z lower than npmjs.com's current latest fails either way.
      #     As latest it would move latest backwards; as next it would label an
      #     old-line patch "upcoming". Such a release needs a hand-picked tag.
      #     Fail before installing or building if the target or version is missing,
      #     the target is unsupported, or the guard refuses.
      # -----------------------------------------------------------------------
      - name: Resolve release metadata
        id: release_meta
        env:
          BUILD_TARGET: ${{ inputs.build_target }}
          LATEST: ${{ inputs.latest }}
        run: |
          set -euo pipefail
          case "$BUILD_TARGET" in
            compile-cleartext-v-cur)
              directory="$(node -p "require('./npm-manifest.json').generations?.['host-contracts-cleartext']?.current ?? ''")"
              if [[ -z "$directory" ]]; then
                echo "::error::npm-manifest.json#generations.host-contracts-cleartext.current is missing"
                exit 1
              fi
              payload="${directory}/pkg"
              ;;
            compile-hh-v2-plugin)
              payload='./hardhat/v2/plugin/pkg'
              ;;
            compile-hh-v3-plugin)
              payload='./hardhat/v3/plugin/pkg'
              ;;
            compile-forge-std)
              payload='./foundry/forge-fhevm-std/pkg'
              ;;
            *)
              echo "::error::unsupported build_target '${BUILD_TARGET}'"
              exit 1
              ;;
          esac
          export PAYLOAD="$payload"
          version="$(node -p "require('./versions.json').packages[process.env.PAYLOAD] ?? ''")"
          if [[ -z "$version" ]]; then
            echo "::error::'${payload}' has no entry in ./versions.json — is the payload key right?"
            exit 1
          fi
          if [[ "$version" == *-* ]]; then
            dist_tag="alpha"
          else
            if [[ "$LATEST" == "true" ]]; then dist_tag="latest"; else dist_tag="next"; fi
            name="$(node -p 'require(process.env.PAYLOAD + "/package.json").name')"
            # A never-published package has no latest (E404); any other registry failure stops the run.
            err="${RUNNER_TEMP:-/tmp}/npm-view.err"
            if npm_latest="$(npm view "$name" dist-tags.latest 2>"$err")"; then :; elif grep -q E404 "$err"; then npm_latest=''; else cat "$err"; exit 1; fi
            if [[ -n "$npm_latest" ]]; then
              order="$(VERSION="$version" LATEST="$npm_latest" node --input-type=module -e "import { compareVersions, parseVersion } from './fhevm-npm/base/semver.ts'; const v = parseVersion(process.env.VERSION), l = parseVersion(process.env.LATEST); if (!v || !l) process.exit(2); process.stdout.write(String(Math.sign(compareVersions(v, l))));")"
              if [[ "$order" == "-1" ]]; then
                echo "::error::${name}@${version} is lower than npmjs.com latest ${npm_latest}; it can be published neither as latest nor as next — publish it by hand under its own tag"
                exit 1
              fi
            fi
          fi
          echo "${payload} ${version} -> dist-tag ${dist_tag}"
          echo "payload=${payload}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "dist_tag=${dist_tag}" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # 2c. Foundry
      #     Foundry installs the Solidity dependencies needed by all three builds.
      #     Install the stable release, then check its version against npm-manifest.json.
      #     If the versions differ, the build stops.
      # -----------------------------------------------------------------------
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@82dee4ba654bd2146511f85f0d013af94670c4de # v1.4.0
        with:
          version: v1.5.1

      # -----------------------------------------------------------------------
      # 3. safe-chain
      #    Aikido's supply-chain monitor. Hooks into npm install so that any
      #    package with a known-malicious checksum is blocked before it can
      #    execute. --ci makes it exit non-zero on any violation instead of
      #    prompting interactively.
      # -----------------------------------------------------------------------
      - name: Install safe-chain
        shell: bash
        run: |
          # safe-chain v1.5.3 is distributed as an immutable GitHub release asset —
          # its content is permanently fixed and cannot be modified after the tag is published.
          # Verify immutability: curl -fsSL https://api.github.com/repos/AikidoSec/safe-chain/releases/tags/1.5.3 | grep immutable
          curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.3/install-safe-chain.sh | sh -s -- --ci

      # -----------------------------------------------------------------------
      # 4. Upgrade npm
      #    The bundled npm in Node 22 may not support provenance publishing.
      #    Pin to the same version used in the sibling library-solidity workflow
      #    for consistency. Block 8 passes --provenance explicitly, since these
      #    payloads carry no .npmrc of their own.
      # -----------------------------------------------------------------------
      - name: Update npm
        run: npm install -g npm@11.7.0

      # -----------------------------------------------------------------------
      # 5. Install dependencies
      #    Use `npm ci` to install the exact package versions saved in the lockfiles.
      #    Also install Solidity dependencies.
      #    Stop if a lockfile does not match its package.json.
      #    Warning: do not use `make install` (it calls `npm install`
      #    instead of `npm ci`)
      # -----------------------------------------------------------------------
      - name: Install dependencies
        run: make install-ci

      # -----------------------------------------------------------------------
      # 6. Build
      #    Build the selected package and the packages it needs.
      #    Keep the pre-build checks, but run no tests here.
      #    sdk-cleartext-tests.yml handles the full checks and tests before merge.
      # -----------------------------------------------------------------------
      - name: Build
        env:
          BUILD_TARGET: ${{ inputs.build_target }}
        run: make "$BUILD_TARGET"

      # -----------------------------------------------------------------------
      # 7. Pack
      #    Copy the package and replace local file: dependencies with npm version ranges.
      #    Create a .tgz archive without changing the source files.
      #    Save its path so step 8 publishes this exact archive.
      # -----------------------------------------------------------------------
      - name: Pack the rendered payload
        id: pack
        env:
          PAYLOAD: ${{ steps.release_meta.outputs.payload }}
        run: |
          set -euo pipefail
          tarball="$(./fhevm-npm-cli publish pack "${PAYLOAD}")"
          echo "Packed ${tarball}"
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # 7b. Pack inspection
      #     Show the package files, sizes and dependency versions in the logs.
      #     This is for inspection; step 7c performs the checks.
      # -----------------------------------------------------------------------
      - name: Inspect pack contents
        env:
          PAYLOAD: ${{ steps.release_meta.outputs.payload }}
        run: ./fhevm-npm-cli publish render "${PAYLOAD}"

      # -----------------------------------------------------------------------
      # 7c. Tarball gate
      #     Check that:
      #     - No local `file:` dependencies remain.
      #     - The package version matches versions.json.
      #     - All declared entry points exist in the archive.
      #     - Converted dependency ranges match versions.json.
      #     - npmjs.com has a published version matching each converted range.
      #     - This package version is not already published on npmjs.com.
      #     This means contracts must be published before plugins that need them.
      # -----------------------------------------------------------------------
      - name: Check the tarball against npmjs.com
        env:
          PAYLOAD: ${{ steps.release_meta.outputs.payload }}
        run: ./fhevm-npm-cli publish check "${PAYLOAD}" --check-npmjs

      # -----------------------------------------------------------------------
      # 7d. Tarball package.json
      #     Print the package.json inside the .tgz that step 8 publishes.
      #     npm stores it at package/package.json.
      #     This is for inspection; step 7c performs the checks.
      # -----------------------------------------------------------------------
      - name: Print the tarball package.json
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: tar -xzOf "${TARBALL}" package/package.json

      # -----------------------------------------------------------------------
      # 7e. Hand the tarball to the publish job
      #     Record its sha256 so the publish job can prove it publishes exactly
      #     the archive checked in 7c, and read the package name from the
      #     archive itself (the publish job has no checkout). The artifact name
      #     carries the build target: the release workflow builds three payloads
      #     in one run, and artifact names must be unique within a run.
      # -----------------------------------------------------------------------
      - name: Describe the tarball
        id: artifact
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          BUILD_TARGET: ${{ inputs.build_target }}
        run: |
          set -euo pipefail
          name="$(tar -xzOf "${TARBALL}" package/package.json | node -e 'let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => process.stdout.write(JSON.parse(s).name));')"
          sha256="$(sha256sum "${TARBALL}" | cut -d' ' -f1)"
          echo "${name}: $(basename "${TARBALL}") sha256 ${sha256}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "artifact=npm-tarball-${BUILD_TARGET}" >> "$GITHUB_OUTPUT"
          echo "tarball=$(basename "${TARBALL}")" >> "$GITHUB_OUTPUT"
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"

      - name: Upload the tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.artifact.outputs.artifact }}
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: sdk-publish-payload/publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: 'write' # Required for OIDC / npm provenance attestation
    # One publish at a time per payload. npm itself refuses a version published twice; this keeps the
    # loser of a race from failing noisily halfway.
    concurrency:
      group: sdk-publish-${{ inputs.build_target }}
      cancel-in-progress: false
    steps:
      # -----------------------------------------------------------------------
      # P1. Node.js and npm
      #     Same versions as the build job. npm itself is the only package this
      #     job installs.
      # -----------------------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 22.x

      - name: Update npm
        run: npm install -g npm@11.7.0

      # -----------------------------------------------------------------------
      # P2. Fetch the checked tarball and prove it is the one 7c checked
      # -----------------------------------------------------------------------
      - name: Download the tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/tarball

      - name: Verify the tarball digest
        env:
          TARBALL: ${{ runner.temp }}/tarball/${{ needs.build.outputs.tarball }}
          EXPECTED: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          actual="$(sha256sum "${TARBALL}" | cut -d' ' -f1)"
          if [[ "$actual" != "$EXPECTED" ]]; then
            echo "::error::$(basename "${TARBALL}") sha256 ${actual} differs from the checked ${EXPECTED}"
            exit 1
          fi
          echo "$(basename "${TARBALL}") sha256 ${actual} matches the checked tarball"

      # -----------------------------------------------------------------------
      # 8. Publish to npm
      #    Publish the checked .tgz from step 7 with the tag chosen in 2b.
      #    Make it public and attach proof of the source commit and workflow run.
      #    Use the NPM_TOKEN repository secret to authenticate.
      #    When dry_run is true, skip publishing.
      # -----------------------------------------------------------------------
      - name: Publish to npm
        uses: JS-DevTools/npm-publish@7f8fe47b3bea1be0c3aec2b717c5ec1f3e03410b # v4.1.1
        with:
          package: ${{ runner.temp }}/tarball/${{ needs.build.outputs.tarball }}
          tag: ${{ needs.build.outputs.dist_tag }}
          # Can run in dry-run mode for testing purpose
          dry-run: ${{ inputs.dry_run }}
          provenance: true
          access: public
          token: ${{ secrets.NPM_TOKEN }}

      # -----------------------------------------------------------------------
      # 9. Wait until npmjs.com serves the published version
      #    `npm publish` returns before the registry necessarily lists the new
      #    version. A dependent payload published right after (the Hardhat plugin
      #    after the contracts) fails its step 7c `--check-npmjs` until it does.
      #    Polls the same document step 7c reads, so success here means the next
      #    job's check sees it too. Gives up after 10 minutes.
      #    Skipped on a dry run: nothing was published.
      # -----------------------------------------------------------------------
      - name: Wait for npmjs.com to serve the version
        if: ${{ !inputs.dry_run }}
        env:
          NAME: ${{ needs.build.outputs.name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          name="$NAME"
          # The package document, which lists every published version under `versions`. Deliberately not
          # the per-version URL (<name>/<version>): step 7c reads this document, and the registry caches
          # the two separately. Same URL as fhevm-npm's npmjsPackageUrl: the whole name, URI-encoded.
          url="https://registry.npmjs.org/$(node -p 'encodeURIComponent(process.argv[1])' "$name")"
          # Reads the document on stdin; exits 0 only if it lists exactly $VERSION.
          lists_version='let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => process.exit(JSON.parse(s).versions?.[process.env.VERSION] ? 0 : 1));'
          for attempt in $(seq 1 60); do
            if curl -fsSL "$url" | VERSION="$VERSION" node -e "$lists_version"; then
              echo "${name}@${VERSION} is served by npmjs.com (attempt ${attempt})"
              exit 0
            fi
            echo "${name}@${VERSION} not served yet (attempt ${attempt}/60); retrying in 10s"
            sleep 10
          done
          echo "::error::${name}@${VERSION} still not served by npmjs.com after 10 minutes"
          exit 1
