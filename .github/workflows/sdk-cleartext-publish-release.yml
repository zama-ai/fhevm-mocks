name: sdk-cleartext-publish-release

# Placeholder for the default branch. GitHub only lists a manual workflow when its file exists on
# main, but runs the file from the branch picked in the branch selector. The real workflow lives on
# every release line (release/X.Y.x); this stub exists so the workflow shows up in the Actions UI
# and in `gh workflow run`. Dispatched from main or from a branch cut from main, it fails at once
# with the message below. Keep its `name` and inputs identical to the release copies.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and check without publishing'
        required: false
        default: true
        type: boolean
      latest:
        description: 'Publish X.Y.Z as npm latest (unchecked: next; X.Y.Z-A is always alpha)'
        required: false
        default: true
        type: boolean

permissions: {}

jobs:
  refuse:
    name: not-a-release-branch
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to run outside a release line
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::${GITHUB_WORKFLOW} only runs from a release line (release/X.Y.x); this run is on ${REF}. Pick the release branch in the branch selector and run it again."
          exit 1
