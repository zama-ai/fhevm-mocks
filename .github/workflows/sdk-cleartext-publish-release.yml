name: sdk-cleartext-publish-release

# Publishes the release payloads one after the other, in dependency order:
#   1. host-contracts-cleartext (current generation)
#   2. hardhat plugin v3        (depends on 1 on npmjs.com)
#   3. forge fhevm
# Each step is the same reusable workflow the single-package publish workflows call. A failed step stops the
# ones after it.
#
# All or nothing: before step 1, the `rehearse` job packs and checks all three payloads together, with
# `publish rehearse` (the registry phase and the audit included). A payload a later step would refuse
# therefore stops the release before anything is published, instead of after step 1 is already on npmjs.com.
# Steps 1 and 3 still run their own `publish check --check-npmjs --audit` on the tarball they publish: that
# check, at the time of publish, is what vouches for the published bytes; the rehearsal is the gate before it.
#
# Step 2 relies on the rehearsal, minutes earlier, for what its own check cannot judge:
#   - its audit is off: it would install step 1's version from npmjs.com minutes after its publish, which
#     safe-chain hides for 48 hours. The rehearsal audits it with step 1's tarball instead.
#   - in a dry run its registry phase is off too: step 1 publishes nothing, so the host-contracts-cleartext
#     version it depends on never reaches npmjs.com. Its static checks still run, and the rehearsal judged its
#     dependencies against step 1's tarball. In a real release the registry phase runs: step 1's publish job
#     waits until npmjs.com serves the new version.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and check without publishing'
        required: false
        default: true
        type: boolean
      latest:
        description: 'Publish X.Y.Z as npm latest (unchecked: next; X.Y.Z-A is always alpha)'
        required: false
        default: true
        type: boolean

# No permissions at the workflow level — each calling job declares only what it needs.
permissions: {}

# One release run at a time; a second one queues instead of racing the first.
concurrency:
  group: sdk-publish-release
  cancel-in-progress: false

jobs:
  # Packs, checks and audits the three payloads before any is published (see the header). It holds no secret
  # and no id-token: like the publish workflow's build job, it runs dependency install scripts, so it gets
  # nothing worth stealing. Setup mirrors that build job; keep the pinned versions in step with it.
  rehearse:
    name: sdk-publish-release/rehearse
    runs-on: ubuntu-latest
    permissions:
      contents: 'read' # Required to checkout repository code
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '>=22.23.4 <23'

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.5.1

      - name: Install safe-chain
        shell: bash
        run: |
          # Same immutable release asset as sdk-cleartext-publish-package.yml.
          curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.3/install-safe-chain.sh | sh -s -- --ci

      - name: Update npm
        run: npm install -g npm@11.7.0

      - name: Install dependencies
        run: make install-ci

      # The three build targets the publish steps below use, and nothing else.
      - name: Build the release payloads
        run: make compile-cleartext-v-cur compile-hh-v3-plugin compile-forge-std

      # Every npm-distributed payload minus the previous generation: the three steps below.
      - name: Rehearse the release
        run: ./fhevm-npm-cli publish rehearse

  # A reusable workflow cannot elevate the caller's GITHUB_TOKEN: whatever sdk-cleartext-publish-package.yml
  # asks for is capped by what is granted on the calling job, so each job grants both.
  host-contracts-cleartext:
    needs: rehearse
    permissions:
      contents: 'read' # Required to checkout repository code
      id-token: 'write' # Required for OIDC / npm provenance attestation
    uses: ./.github/workflows/sdk-cleartext-publish-package.yml
    with:
      build_target: 'compile-cleartext-v-cur' # build the current host-contracts-cleartext
      dry_run: ${{ inputs.dry_run }}
      latest: ${{ inputs.latest }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  hardhat-plugin-v3:
    needs: host-contracts-cleartext
    permissions:
      contents: 'read' # Required to checkout repository code
      id-token: 'write' # Required for OIDC / npm provenance attestation
    uses: ./.github/workflows/sdk-cleartext-publish-package.yml
    with:
      build_target: 'compile-hh-v3-plugin' # build the hardhat plugin v3
      dry_run: ${{ inputs.dry_run }}
      latest: ${{ inputs.latest }}
      # Both judged by the `rehearse` job against step 1's tarball; see the header.
      registry_check: ${{ !inputs.dry_run }}
      audit: false
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  forge-fhevm:
    needs: hardhat-plugin-v3
    permissions:
      contents: 'read' # Required to checkout repository code
      id-token: 'write' # Required for OIDC / npm provenance attestation
    uses: ./.github/workflows/sdk-cleartext-publish-package.yml
    with:
      build_target: 'compile-forge-std' # build forge-fhevm package
      dry_run: ${{ inputs.dry_run }}
      latest: ${{ inputs.latest }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
